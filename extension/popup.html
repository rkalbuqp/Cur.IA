<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Curia IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    header .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
    }
    header h1 {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
    }
    header small {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 13px;
      background: #fff;
      transition: border-color .15s;
    }
    .field input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }
    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(37,99,235,.3);
    }
    button:active { transform: translateY(1px); }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      display: none;
    }
    .status.ok { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .status.err { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .tips {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      font-size: 11.5px;
      color: #64748b;
      line-height: 1.5;
    }
    .tips strong { color: #1e293b; }
  </style>
</head>
<body>
  <header>
    <div class="logo">⛪</div>
    <div>
      <h1>Curia IA</h1>
      <small>Automação de Registros de Casamento</small>
    </div>
  </header>

  <div class="field">
    <label for="backendUrl">URL do Backend (API)</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:8000" />
  </div>

  <button id="saveBtn">💾 Salvar Configurações</button>
  <div id="status" class="status"></div>

  <div class="tips">
    <strong>Como usar:</strong><br />
    1. Inicie o backend Python em <code>/backend</code><br />
    2. Acesse a página do <strong>Cúria Online</strong><br />
    3. Clique no botão ⛪ flutuante para abrir o painel
  </div>

  <script src="popup.js"></script>
</body>
</html>
